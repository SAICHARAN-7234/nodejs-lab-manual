<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Register</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body><div class="container mt-5"><div class="row justify-content-center"><div class="col-md-6">
<h2>Registration</h2><form id="registerForm">
<label class="form-label">Name</label><input id="regName" class="form-control mb-3" required>
<label class="form-label">Email</label><input id="regEmail" type="email" class="form-control mb-3" required>
<label class="form-label">Password</label><input id="regPassword" type="password" class="form-control mb-3" required>
<button class="btn btn-primary">Register</button></form>
<p id="regMsg" class="mt-3"></p>
<a href="login.html">Already registered? Login</a>
</div></div></div>
<script src="app.js"></script>
</body></html>
